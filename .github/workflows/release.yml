name: Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get next available tag
        id: get_tag
        run: |
          # Pega a última tag (ou fallback)
          LATEST_TAG=$(git tag --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
          fi
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

          VERSION=${LATEST_TAG#v}
          IFS='.' read -r -a VERSION_PARTS <<< "$VERSION"

          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}

          # Loop até encontrar uma tag que não exista
          while true; do
            PATCH=$((PATCH + 1))
            NEW_TAG="v$MAJOR.$MINOR.$PATCH"
            if ! git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
              echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
              break
            fi
          done


      - name: Get commit/merge message
        id: commit_info
        run: |
          # Pega a mensagem do último commit
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          echo "commit_message=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          PREV_TAG="${{ steps.get_tag.outputs.latest_tag }}"

          # Gera release notes baseado nos commits
          NOTES=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)

          if [ -z "$NOTES" ]; then
            NOTES="- Melhorias e correções gerais"
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.get_tag.outputs.new_tag }}
          git push origin ${{ steps.get_tag.outputs.new_tag }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_tag.outputs.new_tag }}
          release_name: "${{ steps.get_tag.outputs.new_tag }} - ${{ steps.commit_info.outputs.commit_message }}"
          body: |
            ## 🚀 O que há de novo

            ${{ steps.release_notes.outputs.notes }}

            **Versão anterior:** ${{ steps.get_tag.outputs.latest_tag }}
            **Nova versão:** ${{ steps.get_tag.outputs.new_tag }}
          draft: false
          prerelease: false
